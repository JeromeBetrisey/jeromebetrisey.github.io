  <script src="assets/content.js"></script>
  <script>/* Apply the colour palette before the page is drawn (see `theme` in content.js) */
    (function () { var t; try { t = localStorage.getItem('site-theme'); } catch (e) {}
      t = /^(encre|ardoise|sarcelle|etoile|nuit|foret|aurore|graphite|nebuleuse)$/.test(t || '') ? t : (window.SITE && window.SITE.theme);
      if (t && t !== 'ardoise') document.documentElement.setAttribute('data-theme', t); })();</script>
  <script defer src="assets/site.js"></script>
</head>
<body data-page="publications">
  <header id="site-header" class="site-header"></header>
  <main>
    <section class="page-banner">
      <div class="wrap">
        <h1>Publications</h1>
        <p>Peer-reviewed papers and conference proceedings.</p>
      </div>
    </section>
    <section class="section wrap publication-section" aria-labelledby="pub-list-title">
      <div class="publication-intro">
        <div><h2 id="pub-list-title">Scientific papers</h2></div>
        <a id="ads-more" class="text-link" href="#" hidden>Full list on NASA SciX <span aria-hidden="true">↗</span></a>
      </div>
      <div id="all-publications"></div>
    </section>
    <section class="section wrap publication-section proceedings-section" aria-labelledby="proc-list-title">
      <div class="publication-intro">
        <div><h2 id="proc-list-title">Conference proceedings</h2></div>
      </div>
      <div id="proceedings"></div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Jérôme Bétrisey, astrophysicist at the University of Zurich. Asteroseismology, stellar structure and evolution, and star–planet interactions.">
  <meta name="author" content="Jérôme Bétrisey">
  <title>Jérôme Bétrisey — Astrophysicist</title>
  <!-- Preview shown when the link is shared (Slack, e-mail, LinkedIn, …) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Jérôme Bétrisey — Astrophysicist">
  <meta property="og:description" content="Jérôme Bétrisey, astrophysicist at the University of Zurich. Asteroseismology, stellar structure and evolution, and star–planet interactions.">
  <meta property="og:image" content="assets/hero-star.jpg">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/content.js"></script>
  <script>/* Apply the colour palette before the page is drawn (see `theme` in content.js) */
    (function () { var t; try { t = localStorage.getItem('site-theme'); } catch (e) {}
      t = /^(encre|ardoise|sarcelle|etoile|nuit|foret|aurore|graphite|nebuleuse)$/.test(t || '') ? t : (window.SITE && window.SITE.theme);
      if (t && t !== 'ardoise') document.documentElement.setAttribute('data-theme', t); })();</script>
  <script defer src="assets/site.js"></script>
</head>
<body data-page="home">
  <header id="site-header" class="site-header"></header>
  <main>
    <section id="home" class="hero" aria-labelledby="hero-title">
      <div class="hero-shade"></div>
      <div class="hero-inner wrap">
        <h1 id="hero-title"></h1>
        <p class="hero-role" id="hero-role"></p>
        <div class="hero-rule"></div>
        <p class="hero-tagline" id="hero-tagline"></p>
      </div>
    </section>

    <section id="about" class="section wrap about-section" aria-labelledby="about-title">
      <div class="about-layout">
        <h2 id="about-title" class="about-title"></h2>
        <figure class="portrait-figure">
          <div id="portrait-holder" class="portrait-holder"><span>Portrait placeholder</span></div>
        </figure>
        <div id="about-paragraphs" class="prose about-prose"></div>
        <div class="about-extras">
          <p class="minor-title">Research interests</p>
          <ul id="focus-list" class="focus-list"></ul>
          <div id="about-links" class="plain-links"></div>
        </div>
      </div>
    </section>

    <section id="research" class="section research-section" aria-labelledby="research-title">
      <div class="wrap">
        <div class="section-intro">
          <h2 id="research-title">My research</h2>
          <p id="research-intro"></p>
        </div>
        <div id="research-list" class="research-list"></div>
      </div>
    </section>

    <section id="cv" class="section wrap cv-section" aria-labelledby="cv-title">
      <div class="section-intro">
        <h2 id="cv-title">Curriculum vitae</h2>
        <p id="cv-intro"></p>
      </div>
      <div class="cv-columns">
        <div><h3>Academic appointments</h3><div id="cv-appointments"></div></div>
        <div><h3>Education</h3><div id="cv-education"></div></div>
      </div>
    </section>

    <section id="media" class="section media-section" aria-labelledby="media-title" hidden>
      <div class="wrap">
        <h2 id="media-title">Media & outreach</h2>
        <div id="media-list" class="media-list"></div>
      </div>
    </section>

  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
